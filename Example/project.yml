name: FrugaExample

options:
  bundleIdPrefix: com.example.fruga
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# The SDK is this repository (the folder above). In your own project, add it by
# its repository URL instead (File > Add Package Dependencies...).
packages:
  FrugaSDK:
    path: ..
  FrugaIntegration:
    path: Packages/FrugaIntegration
  FrugaExampleUI:
    path: Packages/FrugaExampleUI

configFiles:
  Debug: Config/Fruga.xcconfig
  Release: Config/Fruga.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    # Signing is left to you: pick your team in Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Config/Info.plist
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"

targets:
  SwiftUIExample:
    type: application
    platform: iOS
    sources:
      - path: SwiftUIExample
    settings:
      base:
        PRODUCT_NAME: SwiftUIExample
        PRODUCT_BUNDLE_IDENTIFIER: $(FRUGA_SWIFTUI_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/SwiftUIExample.entitlements
    dependencies:
      - package: FrugaSDK
        product: FrugaSDK
        embed: false
      - package: FrugaIntegration
      - package: FrugaExampleUI

  UIKitExample:
    type: application
    platform: iOS
    sources:
      - path: UIKitExample
    settings:
      base:
        PRODUCT_NAME: UIKitExample
        PRODUCT_BUNDLE_IDENTIFIER: $(FRUGA_UIKIT_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/UIKitExample.entitlements
    dependencies:
      - package: FrugaSDK
        product: FrugaSDK
        embed: false
      - package: FrugaIntegration
      - package: FrugaExampleUI

  SwiftUIExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwiftUIExampleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(FRUGA_SWIFTUI_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwiftUIExample.app/SwiftUIExample
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: SwiftUIExample

  UIKitExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UIKitExampleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(FRUGA_UIKIT_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/UIKitExample.app/UIKitExample
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - target: UIKitExample

schemes:
  SwiftUIExample:
    build:
      targets:
        SwiftUIExample: all
        SwiftUIExampleTests: [test]
        UIKitExampleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: FrugaExample.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release
  UIKitExample:
    build:
      targets:
        UIKitExample: all
        SwiftUIExampleTests: [test]
        UIKitExampleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: FrugaExample.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release
